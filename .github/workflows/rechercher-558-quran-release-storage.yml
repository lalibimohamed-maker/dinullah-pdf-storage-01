name: Rechercher #558 — Quran 56-language Release storage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rechercher-558-quran-release-storage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rechercher-558-quran-release-storage
  cancel-in-progress: false

jobs:
  acquire-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout storage repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout PR #558 source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lalibimohamed-maker/-dorar-hadith-api-official
          ref: rechercher-quran-official-api-registry-2026-09-22
          path: source-558
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Acquire QuranEnc editions from PR #558
        working-directory: source-558
        run: node scripts/rechercher-acquire-quranenc-translations.mjs
        env:
          QURANENC_CONCURRENCY: 6

      - name: Acquire official institutional editions from PR #558
        working-directory: source-558
        run: node scripts/rechercher-acquire-quran-institutional.mjs

      - name: Build 56-language reconciliation manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const q = JSON.parse(fs.readFileSync(
            "source-558/artifacts/quran-translation-acquisition/manifest.json", "utf8"
          ));
          const i = JSON.parse(fs.readFileSync(
            "source-558/artifacts/quran-institutional-acquisition/manifest.json", "utf8"
          ));

          const qLanguages = [...new Set((q.editions || []).map(x => x.language_iso_code).filter(Boolean))];
          const iLanguages = [...new Set((i.editions || []).map(x => x.language_iso_code).filter(Boolean))];
          const languages = [...new Set([...qLanguages, ...iLanguages])].sort();

          if (qLanguages.length !== 55) throw new Error(`Expected 55 QuranEnc languages, got ${qLanguages.length}`);
          if (!languages.includes("bn")) throw new Error("Institutional Bengali (bn) is missing");
          if (languages.length !== 56) throw new Error(`Expected 56 unique languages, got ${languages.length}`);

          const publicCandidates = (q.editions || [])
            .filter(x => x.status === "acquired_research_only" && x.acquired?.path)
            .filter(x => x.acquired.path.endsWith(".pdf"));

          fs.mkdirSync("release-staging", {recursive:true});
          fs.writeFileSync(
            "release-staging/quran-558-56-language-manifest.json",
            JSON.stringify({
              schema_version: "2026-09-24",
              source_pr: 558,
              source_branch: "rechercher-quran-official-api-registry-2026-09-22",
              quranenc_language_count: qLanguages.length,
              institutional_language_count: iLanguages.length,
              unique_language_count: languages.length,
              languages,
              quranenc_pdf_count: publicCandidates.length,
              institutional_languages_held_for_rights_review: iLanguages,
              policy: {
                corpus_write: false,
                ai_generated_translation: false,
                canonical_arabic_separate: true,
                public_release_requires_rights_verification: true
              }
            }, null, 2) + "\n"
          );

          for (const e of publicCandidates) {
            const src = path.join("source-558", e.acquired.path);
            const lang = e.language_iso_code;
            const edition = String(e.edition_id).replace(/[^A-Za-z0-9._-]/g, "_");
            const dst = path.join("release-staging", lang + "__" + edition + ".pdf");
            fs.copyFileSync(src, dst);
          }
          NODE

      - name: Create durable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="rechercher-558-quran-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" release-staging/*             --repo "$GITHUB_REPOSITORY"             --title "Rechercher #558 — Quran translation acquisition"             --notes "Source: PR #558 branch. The reconciliation manifest records 56 unique languages (55 QuranEnc + Bengali institutional source). Only QuranEnc PDF assets are promoted here; institutional assets remain excluded from public Release storage until explicit redistribution rights are verified."
